aid: upwing-energy
name: Upwing Energy
description: 'Upwing Energy is an energy technology company founded in 2016 and headquartered
  in Cerritos, California, with service operations near Houston, Texas, operating as
  an affiliate of Calnetix Technologies. It designs, manufactures and deploys the Subsurface
  Compressor System (SCS) — a downhole gas compressor installed up to two miles inside
  a natural gas well — along with Magnetic Drive Systems and the supporting high-speed
  permanent magnet motors, passive magnetic radial bearings, active magnetic thrust
  bearings, magnetic couplings and sensorless long-step-out variable speed drives that
  make it work. The company sells hardware and an end-to-end field service (planning
  and completions, deployment and startup, operations and monitoring, analysis and
  predictions) to natural gas operators worldwide, including deployments with Equinor,
  ENAP and operators across MENA and Central Asia. It publishes no developer program,
  public API, SDK or machine-readable specification.'
